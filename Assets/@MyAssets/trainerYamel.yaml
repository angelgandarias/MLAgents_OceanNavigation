behaviors:
  My Behavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0001
      beta: 0.01
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 8
    max_steps: 10000000
    summary_freq: 5000

environment_parameters:
  storm_intensity:
    curriculum:
      - name: Nivel_1_Calma
        completion_criteria:
          measure: reward
          behavior: My Behavior
          signal_smoothing: true
          min_lesson_length: 200
